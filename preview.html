<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboTeach VR Preview</title>
<style>html,body{margin:0;height:100%;background:#14171c;color:#eee;font-family:system-ui} #app{position:fixed;inset:0} .hud{position:fixed;top:12px;left:12px;background:#000d;padding:12px;border-radius:12px;font-size:13px;width:300px;pointer-events:none} .hud h1{font-size:14px;margin:0 0 8px} .zone{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid #333;background:#1c2128;color:#fff;cursor:pointer;pointer-events:auto} .zone:hover{background:#2a323c} .zone.active{border-color:#ffb300;background:#2b250f} .zone b{display:block;font-size:13px} .zone span{font-size:11px;color:#aeb9c5} .zone i{font-style:normal;float:right;color:#ffb300;font-size:11px} canvas{display:block} #info{font-size:11px;color:#9fd;margin-top:8px} #log{white-space:pre-wrap;font-size:10px;color:#678;max-height:80px;overflow:auto;margin-top:4px;pointer-events:auto} .row{display:flex;gap:4px} .row .zone{flex:1}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="app"></div>
<div class="hud"><h1>RoboTeach VR — choose a zone</h1>
<button class="zone" data-z="all"><i>0</i><b>Overview</b><span>40×30m facility</span></button>
<button class="zone" data-z="hub"><i>1</i><b>Central Hub</b><span>menu kiosk + spawn</span></button>
<button class="zone" data-z="z1"><i>2</i><b>Z1 · Smart Warehouse</b><span>Naima — sorting robot + AGV</span></button>
<button class="zone" data-z="z2"><i>3</i><b>Z2 · Vision QC</b><span>Chaima — camera + auditor</span></button>
<button class="zone" data-z="z3"><i>4</i><b>Z3 · Assembly Cell</b><span>Ameen — robot + operator</span></button>
<button class="zone" data-z="z4"><i>5</i><b>Z4 · Diagnosis</b><span>Jihed — cabinet + technician</span></button>
<div id="info">left-drag=orbit | wheel=zoom | right-drag=pan | WASD=fly | 0-5=zones</div><div id="log"></div></div>
<script type="module">
const logEl=document.getElementById('log'), infoEl=document.getElementById('info');
const log=(m)=>{logEl.textContent+=m+'\n';console.log(m);};
window.addEventListener('error',e=>log('window.onerror: '+(e.message||e.error)));
log('step 1: importing three…');
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
log('step 2: three '+THREE.REVISION+' loaded');
const app=document.getElementById('app');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
  log('step 3: WebGL renderer OK');
}catch(err){ infoEl.textContent='WebGL failed: '+err.message; log('WebGL failed: '+err.stack); throw err; }
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x14171c);
scene.add(new THREE.GridHelper(40,40,0x555555,0x333333));
const testCube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xff8800}));
testCube.position.set(0,0.5,0); scene.add(testCube);
log('step 4: scene+grid+test-cube added (if you see orange cube, renderer works)');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,300);
camera.position.set(18,16,22);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1,0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.screenSpacePanning=false; controls.minDistance=2; controls.maxDistance=80;
window._cam=camera; window._ctl=controls;
scene.add(new THREE.HemisphereLight(0xeaf2ff,0x555555,0.9));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(12,20,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:60});
sun.shadow.camera.updateProjectionMatrix(); scene.add(sun);
const VIEWS={
 all:{eye:[18,16,22],look:[0,1,0],label:'Overview — 40×30m facility'},
 hub:{eye:[0,2.4,5.8],look:[0,1.4,0],label:'Central Hub — menu kiosk + spawn'},
 z1:{eye:[-8.6,1.7,-4.2],look:[-12.5,1.0,-8.8],label:'Z1 Warehouse (Naima) — sorting robot + AGV'},
 z2:{eye:[12,1.7,-3.4],look:[12,1.2,-9.2],label:'Z2 Vision QC (Chaima) — camera + auditor'},
 z3:{eye:[-11,1.7,12.8],look:[-12.8,1.1,7.2],label:'Z3 Assembly (Ameen) — robot + operator'},
 z4:{eye:[11.2,1.7,4.2],look:[13.2,1.0,9.8],label:'Z4 Diagnosis (Jihed) — cabinet + technician'}};
let tween=null;
function flyTo(key){
  const v=VIEWS[key]; if(!v) return;
  document.querySelectorAll('.zone').forEach(b=>b.classList.toggle('active',b.dataset.z===key));
  infoEl.textContent=v.label;
  tween={t:0,fromP:camera.position.clone(),toP:new THREE.Vector3(...v.eye),
         fromT:controls.target.clone(),toT:new THREE.Vector3(...v.look)};
  log('flyTo '+key);
}
window._go=flyTo;
document.querySelectorAll('.zone').forEach(b=>b.onclick=()=>flyTo(b.dataset.z));
addEventListener('keydown',e=>{const m={Digit0:'all',Digit1:'hub',Digit2:'z1',Digit3:'z2',Digit4:'z3',Digit5:'z4'};if(m[e.code])flyTo(m[e.code]);});
for(const ev of ['pointerdown','wheel']) renderer.domElement.addEventListener(ev,()=>tween=null,{passive:true});
const _update=controls.update.bind(controls);
controls.update=function(){if(tween){tween.t+=1/85;const k=tween.t>=1?1:(tween.t<0.5?4*tween.t**3:1-((-2*tween.t+2)**3)/2);
  camera.position.lerpVectors(tween.fromP,tween.toP,k);controls.target.lerpVectors(tween.fromT,tween.toT,k);
  if(tween.t>=1)tween=null;}return _update();};
// explicit fetch check so HTTP errors are visible
const qp=new URLSearchParams(location.search); const modelFile=qp.get('model')||'./RoboTeachVR.glb';
const url=modelFile+(modelFile.includes('?')?'&':'?')+Date.now();
log('step 5: fetching '+url);
fetch(url).then(async r=>{
  log('fetch status='+r.status+' type='+r.headers.get('content-type')+' len='+(r.headers.get('content-length')||'?'));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const buf=await r.arrayBuffer(); log('got '+buf.byteLength+' bytes, parsing…');
  new GLTFLoader().parse(buf,'',g=>{
    scene.add(g.scene); scene.remove(testCube);
    let n=0; g.scene.traverse(o=>{if(o.isMesh){n++;o.castShadow=true;o.receiveShadow=true;}});
    infoEl.textContent='loaded GLB: '+n+' meshes. drag=orbit wheel=zoom';
    log('OK: '+n+' meshes added');
  },e=>{ infoEl.textContent='parse error: '+(e.message||e); log('parse error: '+(e.stack||e)); });
}).catch(e=>{ infoEl.textContent='fetch failed — open via http://localhost:8000/preview.html (not file://)'; log('fetch error: '+(e.stack||e)); });
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
// WASD / arrows fly + Q/E up/down
const keys={}; addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
setInterval(()=>{
  const sp=keys['ShiftLeft']?10:4, f=new THREE.Vector3(); camera.getWorldDirection(f); f.y=0; f.normalize();
  const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0));
  const mv=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])mv.add(f); if(keys['KeyS']||keys['ArrowDown'])mv.sub(f);
  if(keys['KeyD']||keys['ArrowRight'])mv.add(r); if(keys['KeyA']||keys['ArrowLeft'])mv.sub(r);
  if(keys['KeyE'])mv.y+=1; if(keys['KeyQ'])mv.y-=1;
  if(mv.lengthSq()>0){mv.normalize().multiplyScalar(sp*0.05);camera.position.add(mv);controls.target.add(mv);}
},16);
</script></body></html>
